version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netguardian-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./netguardian.db
      - SECRET_KEY=netguardian-production-super-secure-key-2026
      - ALGORITHM=HS256
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
    volumes:
      - ./backend/netguardian.db:/app/netguardian.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netguardian-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
